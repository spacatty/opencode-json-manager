<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode JSON Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%233b5bfd'/><path d='M12.5 9c-3 0-3 2-3 4s-1 3-3 3c2 0 3 1 3 3s0 4 3 4M19.5 9c3 0 3 2 3 4s1 3 3 3c-2 0-3 1-3 3s0 4-3 4' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="34" height="34"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M12.5 9c-3 0-3 2-3 4s-1 3-3 3c2 0 3 1 3 3s0 4 3 4M19.5 9c3 0 3 2 3 4s1 3 3 3c-2 0-3 1-3 3s0 4-3 4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span>
        <span class="brand-text"><b>OpenCode</b><span>Config manager</span></span>
      </div>

      <nav class="nav-list" aria-label="Sections">
        <div class="nav-label">Models</div>
        <button data-view="providers" class="nav active"><span class="ico" data-icon="server"></span><span class="nav-text">Providers</span><span class="nav-count" id="count-providers"></span></button>
        <button data-view="defaults" class="nav"><span class="ico" data-icon="star"></span><span class="nav-text">Default models</span></button>
        <div class="nav-label">Configuration</div>
        <button data-view="settings" class="nav"><span class="ico" data-icon="sliders"></span><span class="nav-text">All settings</span></button>
        <button data-view="files" class="nav"><span class="ico" data-icon="doc"></span><span class="nav-text">Rules &amp; agents</span></button>
        <button data-view="raw" class="nav"><span class="ico" data-icon="braces"></span><span class="nav-text">Raw JSON</span></button>
      </nav>

      <div class="side-bottom">
        <div class="filecard" title="Config file being edited. Click to switch.">
          <div class="fc-top">
            <span id="file-scope" class="tag"></span>
            <span id="file-badge" class="tag plain"></span>
            <span class="fc-chev" data-icon="chevrons"></span>
          </div>
          <div class="fc-name" id="file-name">opencode.json</div>
          <div class="fc-path" id="file-dir"></div>
          <select id="file-select" class="fc-select" aria-label="Config file to edit"></select>
        </div>
        <div class="side-foot">
          <span id="side-foot" class="schema"><span class="status-dot"></span><span>Loading schema…</span></span>
          <button id="reload" class="btn icon ghost sm" title="Reload the file from disk" aria-label="Reload the file from disk"><span class="ico" data-icon="refresh"></span></button>
        </div>
      </div>
    </aside>

    <main class="main" id="sheet">
      <div class="page">
        <div id="banner"></div>
        <div id="main"></div>
      </div>
    </main>
  </div>

  <div id="savebar" class="savebar" hidden role="region" aria-label="Unsaved changes">
    <span class="sb-dot"></span>
    <span class="sb-text"><b>Unsaved changes</b><span id="dirty-text"></span></span>
    <button id="discard" class="btn sb-ghost">Discard</button>
    <button id="save" class="btn primary" disabled>Save changes <kbd>Ctrl S</kbd></button>
  </div>
  <div id="dirty" hidden></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
